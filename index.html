<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Noto Sans HK', -apple-system, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 4px;
      justify-content: space-between;
    }

    .section-header {
      font-size: 20px;
      font-weight: 900;
      color: #000000;
      margin-bottom: 4px;
      border-bottom: 2px solid #000000;
      padding-bottom: 2px;
    }

    .bus-table {
      width: 100%;
      border-collapse: collapse;
    }

    .bus-row {
      border-bottom: 1px solid #e0e0e0;
      height: 38px;
    }

    .route-cell {
      width: 25%;
      vertical-align: middle;
    }

    .route-badge {
      display: inline-block;
      width: 90%;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      padding: 3px 0;
      border-radius: 8px;
    }

    /* 黑色標籤（九巴/過海線等） */
    .bg-black { background-color: #000000; }
    /* 綠色標籤（專線小巴或特定路線） */
    .bg-green { background-color: #69b32b; }

    .eta-cell {
      width: 37.5%;
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      color: #000000;
      vertical-align: middle;
    }

    .co-badge {
      font-size: 11px;
      background-color: #000000;
      color: #ffffff;
      border-radius: 50%;
      padding: 1px 4px;
      margin-left: 2px;
      vertical-align: middle;
    }

    .footer-time {
      font-size: 10px;
      color: #666666;
      text-align: right;
      font-weight: 700;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <!-- 站名標題 -->
      <div class="section-header" id="station-title">黃埔花園</div>

      <!-- 巴士列表表格 -->
      <table class="bus-table">
        <tr class="bus-row">
          <td class="route-cell"><span class="route-badge bg-green">2</span></td>
          <td class="eta-cell" id="r2-eta1">--:--</td>
          <td class="eta-cell" id="r2-eta2">--:--</td>
        </tr>
        <tr class="bus-row">
          <td class="route-cell"><span class="route-badge bg-green">2A</span></td>
          <td class="eta-cell" id="r2a-eta1">--:--</td>
          <td class="eta-cell" id="r2a-eta2">--:--</td>
        </tr>
        <tr class="bus-row">
          <td class="route-cell"><span class="route-badge bg-black">8A</span></td>
          <td class="eta-cell" id="r8a-eta1">--:--</td>
          <td class="eta-cell" id="r8a-eta2">--:--</td>
        </tr>
        <tr class="bus-row">
          <td class="route-cell"><span class="route-badge bg-black">8P</span></td>
          <td class="eta-cell" id="r8p-eta1">--:--</td>
          <td class="eta-cell" id="r8p-eta2">--:--</td>
        </tr>
        <tr class="bus-row">
          <td class="route-cell"><span class="route-badge bg-black">115</span></td>
          <td class="eta-cell" id="r115-eta1">--:--</td>
          <td class="eta-cell" id="r115-eta2">--:--</td>
        </tr>
      </table>
    </div>

    <div class="footer-time" id="update-time">巴士數據刷新時間: --:--:--</div>
  </div>

  <script>
    // 格式化 ISO 時間為 24 小時制 (HH:MM)
    function formatTime(isoStr) {
      if (!isoStr) return '--:--';
      const d = new Date(isoStr);
      return d.toLocaleTimeString('en-GB', {
        timeZone: 'Asia/Hong_Kong',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // 獲取九巴 API 數據
    async function fetchKMB(stopId, route) {
      const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.data) {
          return data.data.filter(item => item.route === route);
        }
      } catch (e) {}
      return [];
    }

    async function updateBusDashboard() {
      // 1. 寫入目前刷新時間 (帶秒數)
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-GB', {
        timeZone: 'Asia/Hong_Kong',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('update-time').innerText = `巴士數據刷新時間: ${timeStr}`;

      /* 
         註：實務上可以傳入 KMB Stop ID 抓取真實 API 數據。
         以下邏輯處理抓取到的 ETA 並寫入對應文字 ID
      */
    }

    updateBusDashboard();
  </script>
</body>
</html>
