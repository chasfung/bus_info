<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    .route-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 800;
      color: #ffffff;
    }

    .badge-kmb { background-color: #000000; }
    .badge-gmb { background-color: #38b000; }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between box-border">

  <div class="space-y-4">
    <!-- 第一組：紅磡南道 -->
    <div>
      <div class="mb-2 pb-1 border-b-2 border-black">
        <h2 class="text-2xl font-black">紅磡南道</h2>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">12A</span>
          <span id="eta-12a-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-12a-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">7B</span>
          <span id="eta-7b-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-7b-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">15</span>
          <span id="eta-15-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-15-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">297</span>
          <span id="eta-297-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-297-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">269B</span>
          <span id="eta-269b-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-269b-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
      </div>
    </div>

    <!-- 第二組：黃埔花園 -->
    <div>
      <div class="mb-2 pb-1 border-b-2 border-black">
        <h2 class="text-2xl font-black">黃埔花園</h2>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-gmb text-xl w-[110px] py-1">2</span>
          <span id="eta-gmb2-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-gmb2-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-gmb text-xl w-[110px] py-1">2A</span>
          <span id="eta-gmb2a-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-gmb2a-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">8A</span>
          <span id="eta-8a-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-8a-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1 border-b border-gray-200">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">8P</span>
          <span id="eta-8p-1" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
          <span id="eta-8p-2" class="text-2xl font-extrabold w-[140px] text-center">--:--</span>
        </div>
        <div class="flex items-center justify-between py-1">
          <span class="route-badge badge-kmb text-xl w-[110px] py-1">115</span>
          <span id="eta-115-1" class="text-2xl font-extrabold w-[140px] text-center relative flex items-center justify-center">--:--</span>
          <span id="eta-115-2" class="text-2xl font-extrabold w-[140px] text-center relative flex items-center justify-center">--:--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="text-right text-xs font-bold text-gray-500 mt-4">
    巴士數據刷新時間: <span id="bus-last-update">--:--:--</span>
  </div>

  <script>
    function formatTimeStr(isoString) {
      if (!isoString) return "--:--";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return "--:--";
      return d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
    }

    async function fetchAPI(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {}
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const resProxy = await fetch(proxyUrl);
        if (resProxy.ok) return await resProxy.json();
      } catch (e) {}
      return null;
    }

    async function fetchKMB(stopId, route, el1, el2) {
      const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`;
      const json = await fetchAPI(url);
      if (json && Array.isArray(json.data)) {
        const etas = json.data.filter(item => item.route === route && item.eta).map(i => i.eta);
        document.getElementById(el1).textContent = formatTimeStr(etas[0]);
        document.getElementById(el2).textContent = formatTimeStr(etas[1]);
      } else {
        document.getElementById(el1).textContent = "--:--";
        document.getElementById(el2).textContent = "--:--";
      }
    }

    async function fetchGMB(routeId, stopSeq, el1, el2) {
      const url = `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/1/${stopSeq}`;
      const json = await fetchAPI(url);
      let etas = [];
      if (json && json.data && Array.isArray(json.data.eta)) {
        etas = json.data.eta.map(i => i.timestamp).filter(Boolean);
      }
      document.getElementById(el1).textContent = formatTimeStr(etas[0]);
      document.getElementById(el2).textContent = formatTimeStr(etas[1]);
    }

    async function updateCombined115() {
      let allEtas = [];
      const jsonKmb = await fetchAPI('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/1103A58F52D6CE51');
      if (jsonKmb && Array.isArray(jsonKmb.data)) {
        jsonKmb.data.filter(i => i.route === '115' && i.eta).forEach(i => allEtas.push({ time: new Date(i.eta), co: '九' }));
      }

      const jsonCtb = await fetchAPI('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002422/115');
      if (jsonCtb && Array.isArray(jsonCtb.data)) {
        jsonCtb.data.filter(i => i.eta).forEach(i => allEtas.push({ time: new Date(i.eta), co: '城' }));
      }

      allEtas = allEtas.filter(i => !isNaN(i.time.getTime())).sort((a, b) => a.time - b.time);

      function renderEta(item) {
        if (!item) return "--:--";
        const tStr = item.time.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
        const badgeClass = item.co === '九' ? 'bg-black text-white' : 'bg-gray-200 text-black border border-black';
        return `${tStr}<span class="absolute right-2 text-[10px] font-bold px-1 py-0.5 rounded leading-none ${badgeClass}">${item.co}</span>`;
      }

      document.getElementById('eta-115-1').innerHTML = renderEta(allEtas[0]);
      document.getElementById('eta-115-2').innerHTML = renderEta(allEtas[1]);
    }

    async function updateAllBuses() {
      const hungHomSouth = '90BA441334E95B30';
      const whampoa = '1103A58F52D6CE51';

      await Promise.all([
        fetchKMB(hungHomSouth, '12A', 'eta-12a-1', 'eta-12a-2'),
        fetchKMB(hungHomSouth, '7B', 'eta-7b-1', 'eta-7b-2'),
        fetchKMB(hungHomSouth, '15', 'eta-15-1', 'eta-15-2'),
        fetchKMB(hungHomSouth, '297', 'eta-297-1', 'eta-297-2'),
        fetchKMB(hungHomSouth, '269B', 'eta-269b-1', 'eta-269b-2'),
        fetchKMB(whampoa, '8A', 'eta-8a-1', 'eta-8a-2'),
        fetchKMB(whampoa, '8P', 'eta-8p-1', 'eta-8p-2'),
        fetchGMB('2003233', '1', 'eta-gmb2-1', 'eta-gmb2-2'),
        fetchGMB('2003234', '1', 'eta-gmb2a-1', 'eta-gmb2a-2'),
        updateCombined115()
      ]);

      const now = new Date();
      document.getElementById('bus-last-update').textContent = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    updateAllBuses();
    setInterval(updateAllBuses, 60 * 1000);
  </script>
</body>
</html>
