<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, height=758, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bus Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    .route-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 900;
      color: #ffffff;
    }

    .badge-kmb { background-color: #000000; }
    .badge-gmb { background-color: #38b000; }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between box-border">

  <div class="space-y-6">
    <!-- 第一組：紅磡南道 -->
    <div>
      <div class="mb-2 pb-1 border-b-2 border-black">
        <h2 class="text-3xl font-black tracking-wide">紅磡南道</h2>
      </div>

      <div class="space-y-1">
        <!-- 12A -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">12A</span>
          <span id="eta-12a-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-12a-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 7B -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">7B</span>
          <span id="eta-7b-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-7b-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 15 -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">15</span>
          <span id="eta-15-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-15-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 297 -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">297</span>
          <span id="eta-297-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-297-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 269B -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">269B</span>
          <span id="eta-269b-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-269b-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
      </div>
    </div>

    <!-- 第二組：黃埔花園 -->
    <div class="mt-4">
      <div class="mb-2 pb-1 border-b-2 border-black">
        <h2 class="text-3xl font-black tracking-wide">黃埔花園</h2>
      </div>

      <div class="space-y-1">
        <!-- 2 -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-gmb text-2xl w-[120px] py-1">2</span>
          <span id="eta-gmb2-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-gmb2-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 2A -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-gmb text-2xl w-[120px] py-1">2A</span>
          <span id="eta-gmb2a-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-gmb2a-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 8A -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">8A</span>
          <span id="eta-8a-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-8a-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 8P -->
        <div class="flex items-center justify-between py-1.5 border-b border-gray-200">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">8P</span>
          <span id="eta-8p-1" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
          <span id="eta-8p-2" class="text-3xl font-extrabold w-[160px] text-center">--:--</span>
        </div>
        <!-- 115 -->
        <div class="flex items-center justify-between py-1.5">
          <span class="route-badge badge-kmb text-2xl w-[120px] py-1">115</span>
          <span id="eta-115-1" class="text-3xl font-extrabold w-[160px] text-center relative flex items-center justify-center">--:--</span>
          <span id="eta-115-2" class="text-3xl font-extrabold w-[160px] text-center relative flex items-center justify-center">--:--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="text-right text-sm font-bold text-gray-500 mt-6">
    巴士數據刷新時間: <span id="bus-last-update">--:--:--</span>
  </div>

  <script>
    /* 格式化時間 HH:mm */
    function formatTimeStr(isoString) {
      if (!isoString) return "--:--";
      if (typeof isoString === 'string' && /^\d{2}:\d{2}$/.test(isoString)) return isoString;
      const d = new Date(isoString);
      if (isNaN(d.getTime())) {
        const match = String(isoString).match(/(\d{2}):(\d{2})/);
        if (match) return `${match[1]}:${match[2]}`;
        return "--:--";
      }
      return d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
    }

    /* 小巴 API 高相容性解析器 */
    function parseGmbEtas(json) {
      let etas = [];
      if (!json) return etas;
      try {
        let items = [];
        if (Array.isArray(json.data)) {
          json.data.forEach(d => {
            if (d && Array.isArray(d.eta)) items.push(...d.eta);
            else if (d && (d.timestamp || d.diff !== undefined)) items.push(d);
          });
        } else if (json.data && Array.isArray(json.data.eta)) {
          items = json.data.eta;
        } else if (json.data && (json.data.timestamp || json.data.diff !== undefined)) {
          items = [json.data];
        }

        items.forEach(item => {
          if (item.timestamp) {
            etas.push(item.timestamp);
          } else if (typeof item.diff === 'number') {
            const target = new Date(Date.now() + item.diff * 60000);
            etas.push(target.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' }));
          }
        });

        if (etas.length === 0) {
          const str = JSON.stringify(json);
          const matches = str.match(/"timestamp"\s*:\s*"([^"]+)"/g);
          if (matches) {
            matches.forEach(m => {
              const valMatch = m.match(/"timestamp"\s*:\s*"([^"]+)"/);
              if (valMatch && valMatch[1]) etas.push(valMatch[1]);
            });
          }
        }
      } catch (err) {}
      return etas;
    }

    /* 通用 Fetch ETA (帶 CORS Proxy 備援) */
    async function fetchETA(url, elementId1, elementId2, isGMB = false) {
      const el1 = document.getElementById(elementId1);
      const el2 = document.getElementById(elementId2);
      if (!el1 || !el2) return;

      try {
        let json = null;
        try {
          const res = await fetch(url);
          if (res.ok) json = await res.json();
          else throw new Error(`HTTP ${res.status}`);
        } catch (directErr) {
          if (isGMB) {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const resProxy = await fetch(proxyUrl);
            json = await resProxy.json();
          } else {
            throw directErr;
          }
        }

        let etas = [];
        if (isGMB) {
          etas = parseGmbEtas(json);
        } else {
          const dataList = (json && Array.isArray(json.data)) ? json.data : [];
          etas = dataList.map(item => item ? item.eta : null).filter(Boolean);
        }

        el1.textContent = formatTimeStr(etas[0]);
        el2.textContent = formatTimeStr(etas[1]);
      } catch (err) {
        el1.textContent = "--:--";
        el2.textContent = "--:--";
      }
    }

    /* 115號線 (九巴+城巴合併) */
    async function updateCombined115() {
      const el1 = document.getElementById('eta-115-1');
      const el2 = document.getElementById('eta-115-2');
      if (!el1 || !el2) return;

      let allEtas = [];

      try {
        const resKmb = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/eta/7055FEADC58CB1F1/115/1');
        const jsonKmb = await resKmb.json();
        if (jsonKmb && Array.isArray(jsonKmb.data)) {
          jsonKmb.data.forEach(item => {
            if (item && item.eta) {
              const d = new Date(item.eta);
              if (!isNaN(d.getTime())) allEtas.push({ time: d, company: '九' });
            }
          });
        }
      } catch (e) {}

      try {
        const resCtb = await fetch('https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/001477/115');
        const jsonCtb = await resCtb.json();
        if (jsonCtb && Array.isArray(jsonCtb.data)) {
          jsonCtb.data.forEach(item => {
            if (item && item.eta) {
              const d = new Date(item.eta);
              if (!isNaN(d.getTime())) allEtas.push({ time: d, company: '城' });
            }
          });
        }
      } catch (e) {}

      allEtas.sort((a, b) => a.time - b.time);

      function renderEtaHTML(item) {
        if (!item) return "--:--";
        const tStr = item.time.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
        const badgeClass = item.company === '九' ? 'bg-black text-white' : 'bg-gray-200 text-black border border-black';
        return `${tStr}<span class="absolute right-0 text-xs font-bold px-1.5 py-0.5 rounded leading-none ${badgeClass}">${item.company}</span>`;
      }

      el1.innerHTML = renderEtaHTML(allEtas[0]);
      el2.innerHTML = renderEtaHTML(allEtas[1]);
    }

    function updateAllBuses() {
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/EF5A5CD9C3A038C9/12A/1', 'eta-12a-1', 'eta-12a-2');
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/EF5A5CD9C3A038C9/7B/1', 'eta-7b-1', 'eta-7b-2');
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/EF5A5CD9C3A038C9/15/1', 'eta-15-1', 'eta-15-2');
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/EF5A5CD9C3A038C9/297/1', 'eta-297-1', 'eta-297-2');
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/95FAB1D2AD752ECE/269B/1', 'eta-269b-1', 'eta-269b-2');

      fetchETA('https://data.etagmb.gov.hk/eta/route-stop/2009246/1/1', 'eta-gmb2-1', 'eta-gmb2-2', true);
      fetchETA('https://data.etagmb.gov.hk/eta/route-stop/2009247/1/1', 'eta-gmb2a-1', 'eta-gmb2a-2', true);
      
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/75D6E5952B41E1D2/8A/1', 'eta-8a-1', 'eta-8a-2');
      fetchETA('https://data.etabus.gov.hk/v1/transport/kmb/eta/75D6E5952B41E1D2/8P/1', 'eta-8p-1', 'eta-8p-2');
      updateCombined115();

      const now = new Date();
      const busUpdateElem = document.getElementById('bus-last-update');
      if (busUpdateElem) {
        busUpdateElem.textContent = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }
    }

    updateAllBuses();
    setInterval(updateAllBuses, 60 * 1000);
  </script>
</body>
</html>
