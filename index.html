<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Widget Dashboard</title>
  <!-- 必須載入 Google Fonts，解決 SenseCraft 截圖中文字變成亂碼的問題 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      /* 強制應用中文字型 */
      font-family: 'Noto Sans HK', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 4px; /* 緊湊邊距 */
    }

    /* 區塊標題 */
    .section-title {
      font-size: 16px;
      font-weight: 900;
      color: #000000;
      border-bottom: 2px solid #000000;
      margin-top: 2px;
      margin-bottom: 2px;
      padding-bottom: 1px;
    }

    /* 巴士行列 */
    .bus-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaeaea;
      height: calc(100% / 12); /* 動態適應元件高度 */
      min-height: 24px;
    }

    /* 路線號碼標籤 */
    .route-badge {
      display: inline-block;
      width: 48px;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 0;
    }
    .badge-kmb { background-color: #000000; }
    .badge-gmb { background-color: #38b000; }

    /* 到站時間文字 */
    .eta-box {
      font-size: 17px;
      font-weight: 900;
      color: #000000;
      width: 38%;
      text-align: center;
      position: relative;
    }

    /* 115 聯營線公司小標籤 */
    .co-label {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      padding: 1px 3px;
      border-radius: 3px;
      line-height: 1;
      font-weight: 900;
    }
    .co-kmb { background-color: #000000; color: #ffffff; }
    .co-ctb { background-color: #f3f4f6; color: #000000; border: 1px solid #000000; }

    /* 底部更新時間 */
    .footer {
      font-size: 10px;
      color: #666666;
      text-align: right;
      font-weight: 700;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- 第一組：紅磡南道 -->
  <div>
    <div class="section-title">紅磡南道</div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">12A</span>
      <span class="eta-box" id="eta-12a-1">--:--</span>
      <span class="eta-box" id="eta-12a-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">7B</span>
      <span class="eta-box" id="eta-7b-1">--:--</span>
      <span class="eta-box" id="eta-7b-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">15</span>
      <span class="eta-box" id="eta-15-1">--:--</span>
      <span class="eta-box" id="eta-15-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">297</span>
      <span class="eta-box" id="eta-297-1">--:--</span>
      <span class="eta-box" id="eta-297-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">269B</span>
      <span class="eta-box" id="eta-269b-1">--:--</span>
      <span class="eta-box" id="eta-269b-2">--:--</span>
    </div>
  </div>

  <!-- 第二組：黃埔花園 -->
  <div style="margin-top: 4px;">
    <div class="section-title">黃埔花園</div>
    <div class="bus-row">
      <span class="route-badge badge-gmb">2</span>
      <span class="eta-box" id="eta-gmb2-1">--:--</span>
      <span class="eta-box" id="eta-gmb2-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-gmb">2A</span>
      <span class="eta-box" id="eta-gmb2a-1">--:--</span>
      <span class="eta-box" id="eta-gmb2a-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">8A</span>
      <span class="eta-box" id="eta-8a-1">--:--</span>
      <span class="eta-box" id="eta-8a-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">8P</span>
      <span class="eta-box" id="eta-8p-1">--:--</span>
      <span class="eta-box" id="eta-8p-2">--:--</span>
    </div>
    <div class="bus-row">
      <span class="route-badge badge-kmb">115</span>
      <span class="eta-box" id="eta-115-1">--:--</span>
      <span class="eta-box" id="eta-115-2">--:--</span>
    </div>
  </div>

  <div class="footer">巴士數據刷新時間: <span id="bus-last-update">--:--:--</span></div>

  <script>
    /* 格式化時間 */
    function formatTimeStr(isoString) {
      if (!isoString) return "--:--";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return "--:--";
      return d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
    }

    /* 安全抓取 API (帶 CORS Proxy 備援) */
    async function safeFetchJSON(targetUrl) {
      try {
        const res = await fetch(targetUrl);
        if (res.ok) return await res.json();
      } catch (e) {}
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const resProxy = await fetch(proxyUrl);
        if (resProxy.ok) {
          const proxyData = await resProxy.json();
          return JSON.parse(proxyData.contents);
        }
      } catch (e) {}
      return null;
    }

    /* 抓取九巴 */
    async function fetchKMB(stopId, route, el1, el2) {
      const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`;
      const json = await safeFetchJSON(url);
      if (json && Array.isArray(json.data)) {
        const etas = json.data.filter(item => item.route === route && item.eta).map(i => i.eta);
        if (etas[0]) document.getElementById(el1).textContent = formatTimeStr(etas[0]);
        if (etas[1]) document.getElementById(el2).textContent = formatTimeStr(etas[1]);
      }
    }

    /* 抓取小巴 */
    async function fetchGMB(routeId, stopSeq, el1, el2) {
      const url = `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/1/${stopSeq}`;
      const json = await safeFetchJSON(url);
      if (json && json.data && Array.isArray(json.data.eta)) {
        const etas = json.data.eta.map(i => i.timestamp).filter(Boolean);
        if (etas[0]) document.getElementById(el1).textContent = formatTimeStr(etas[0]);
        if (etas[1]) document.getElementById(el2).textContent = formatTimeStr(etas[1]);
      }
    }

    /* 合併 115 聯營線 */
    async function updateCombined115() {
      let allEtas = [];
      const jsonKmb = await safeFetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/1103A58F52D6CE51');
      if (jsonKmb && Array.isArray(jsonKmb.data)) {
        jsonKmb.data.filter(i => i.route === '115' && i.eta).forEach(i => allEtas.push({ time: new Date(i.eta), co: '九' }));
      }
      const jsonCtb = await safeFetchJSON('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002422/115');
      if (jsonCtb && Array.isArray(jsonCtb.data)) {
        jsonCtb.data.filter(i => i.eta).forEach(i => allEtas.push({ time: new Date(i.eta), co: '城' }));
      }

      allEtas = allEtas.filter(i => !isNaN(i.time.getTime())).sort((a, b) => a.time - b.time);

      function renderEta(item) {
        if (!item) return "--:--";
        const tStr = item.time.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit' });
        const badgeClass = item.co === '九' ? 'co-kmb' : 'co-ctb';
        return `${tStr}<span class="co-label ${badgeClass}">${item.co}</span>`;
      }

      if (allEtas[0]) document.getElementById('eta-115-1').innerHTML = renderEta(allEtas[0]);
      if (allEtas[1]) document.getElementById('eta-115-2').innerHTML = renderEta(allEtas[1]);
    }

    async function updateAllBuses() {
      const now = new Date();
      document.getElementById('bus-last-update').textContent = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const hungHomSouth = '90BA441334E95B30';
      const whampoa = '1103A58F52D6CE51';

      await Promise.all([
        fetchKMB(hungHomSouth, '12A', 'eta-12a-1', 'eta-12a-2'),
        fetchKMB(hungHomSouth, '7B', 'eta-7b-1', 'eta-7b-2'),
        fetchKMB(hungHomSouth, '15', 'eta-15-1', 'eta-15-2'),
        fetchKMB(hungHomSouth, '297', 'eta-297-1', 'eta-297-2'),
        fetchKMB(hungHomSouth, '269B', 'eta-269b-1', 'eta-269b-2'),
        fetchKMB(whampoa, '8A', 'eta-8a-1', 'eta-8a-2'),
        fetchKMB(whampoa, '8P', 'eta-8p-1', 'eta-8p-2'),
        fetchGMB('2003233', '1', 'eta-gmb2-1', 'eta-gmb2-2'),
        fetchGMB('2003234', '1', 'eta-gmb2a-1', 'eta-gmb2a-2'),
        updateCombined115()
      ]);
    }

    // 啟動抓取
    updateAllBuses();
  </script>
</body>
</html>
