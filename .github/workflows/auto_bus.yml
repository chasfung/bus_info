name: Auto Update Bus Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Run Fetch Script
        run: node update_bus.js
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bus_data.json
          git commit -m "Auto-update Bus data" || exit 0
          # 自動重試 5 次：如果 Push 失敗，就拉取最新檔案再推過
          for i in 1 2 3 4 5; do
            git pull origin main --no-rebase -X ours || true
            git push && break || sleep 2
          done
